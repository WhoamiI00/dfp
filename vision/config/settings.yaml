workspace:
  width_m: 2.5
  height_m: 2.5
  cell_size_m: 0.25
robot:
  footprint_m: [0.5, 0.5]
  travel_height_m: 0.30
  markers:
    front_color: pink
    back_color: blue
camera:
  # Source can be:
  #   0, 1, 2, ...   -> local USB webcam index (try 1 if 0 is the laptop's built-in)
  #   "http://HOST:8080/video"  -> Android IP Webcam MJPEG stream
  #   "rtsp://..."   -> RTSP camera
  # Phone-on-hotspot setup: phone reaches the laptop directly on the hotspot
  # subnet (192.168.137.x by default on Windows). College LAN doesn't need to
  # see the phone — they're separate adapters.
  source: "http://192.168.137.19:8080/video"
  resolution: [1280, 720]
planner:
  obstacle_inflation_m: 0.10
closed_loop:
  arrival_tolerance_m: 0.25          # ~1 cell
  arrival_heading_tolerance_deg: 30
  max_steps: 50                       # ~100 s max run at typical step times
  stuck_position_threshold_m: 0.05    # min progress per F to count as moving
  stuck_window_steps: 3               # consecutive Fs below threshold -> abort
