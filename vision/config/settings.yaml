workspace:
  width_m: 2.5
  height_m: 2.5
  cell_size_m: 0.25
robot:
  footprint_m: [0.5, 0.5]
  travel_height_m: 0.30
  markers:
    front_color: pink
    back_color: blue
camera:
  source: 0
  resolution: [1280, 720]
planner:
  obstacle_inflation_m: 0.10
closed_loop:
  arrival_tolerance_m: 0.25          # ~1 cell
  arrival_heading_tolerance_deg: 30
  max_steps: 50                       # ~100 s max run at typical step times
  stuck_position_threshold_m: 0.05    # min progress per F to count as moving
  stuck_window_steps: 3               # consecutive Fs below threshold -> abort
